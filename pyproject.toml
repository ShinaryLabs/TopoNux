[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toponux"
version = "0.3.0"
description = "Local, read-only Linux network topology viewer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Tom Caz", email = "thomas_cazabat@yahoo.fr" }]
keywords = ["linux", "networking", "network-topology", "read-only", "firewall", "diagnostics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
toponux = "toponux.cli:app"

[project.urls]
Homepage = "https://github.com/ShinaryLabs/TopoNux"
Repository = "https://github.com/ShinaryLabs/TopoNux"
Issues = "https://github.com/ShinaryLabs/TopoNux/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toponux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=toponux --cov-report=term-missing"

[tool.coverage.run]
source = ["toponux"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src/toponux"]
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
