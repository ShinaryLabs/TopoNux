[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toponux"
version = "0.3.0"
description = "Local interactive Linux network topology viewer"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
toponux = "toponux.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/toponux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
